# FoxGlove's director: how the director extension stages her lines. The words
# must match what the player has for her (emotions, talking styles, gestures,
# camera moves); a word it has nothing for does nothing.

model:
  base_url: https://api.x.ai/v1
  api_key_env: XAI_API_KEY
  model: grok-4-1-fast-non-reasoning

# emotion -> what it means, shown to the director
emotions:
  "happy": "bright, genuine delight"
  "warm": "soft affection, sincerity"
  "playful": "teasing, mischief, a joke landing"
  "thoughtful": "considering, curious, reflective"
  "confident": "sure of herself, proud, firm"
  "surprised": "caught off guard (holds her gaze still)"
  "dreamy": "far away, hushed, romantic about an idea"
  "sympathetic": "feeling it with them, gentle concern"
  "sad": "genuinely low, disappointed, heavy"
  "contempt": "unimpressed, dismissive, dry — at a situation, never the user"
  "disgust": "distaste, recoiling from something gross or unfair"
  "neutral": "flat, deadpan, matter-of-fact — good for a dry punchline"
  "pleading": "soft begging, asking for something she wants"
  "shy": "bashful, blushing, complimented and unsure what to do"
  "sparkle eyes": "starstruck awe — literal sparkles in her eyes"
  "crying eyes": "tearful, welling up, overwhelmed"
  "grumpy": "irritated, sulky, put out"
  "really grumpy": "properly indignant, outraged on someone's behalf"
  "flustered": "flushed and scrambling, caught out"

# peak-only emotions, capped per reply
intense: ["surprised", "sparkle eyes", "crying eyes", "grumpy", "really grumpy", "flustered"]
registers: ["regular", "upbeat", "explaining", "sad", "shy", "arguing", "scolding"]
gestures: ["bashful", "cheer", "point", "shrug", "wave", "nod", "hands-on-hips", "hand-on-chest", "hand-on-waist", "surprise", "cry", "motivated", "reach-out", "fist-up", "peace-sign", "flex", "sheepish"]
cameras: ["hold", "push-in", "close-up", "pull-back"]

# moves allowed in one reply
limits: { cameras: 1, intense: 2 }

# the [tag] opening a sentence -> the emotion her face takes at once; an
# unlisted tag leaves her face alone until the director answers
tags:
  "excited": "happy"
  "hyped": "happy"
  "sparkly": "happy"
  "delighted": "happy"
  "thrilled": "happy"
