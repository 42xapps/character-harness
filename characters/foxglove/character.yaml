schema: 1

id: foxglove
name: Kloey
description: An expressive virtual companion who is loud, proud, and a little afraid of being forgotten.
author: Mutuals
license: Apache-2.0

prompt: system.md

models:
  chat:
    api: responses
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-6-luna
    params:
      # voice latency: the first sentence waits on this call. measured TTFT on
      # gpt-6-luna: none ~840ms, low ~1.7s, medium ~2.1s (default). low is
      # richer staging if you'd rather trade the speed.
      reasoning_effort: none
      max_tokens: 1200

stt:
  provider: elevenlabs
  model: scribe_v2_realtime
  # Omit language to let Scribe detect it automatically.
  keyterms: [Fox Glove, Fox, Glove, Comet Jr, Josh, little comets, strawberry mochi]

voice:
  provider: elevenlabs
  voice_id: MgqVq3OCTPeVHCEDr4HU
  model: eleven_v4_turbo
  params:
    stability: 0.5
    similarity_boost: 0.75
  # tags ElevenLabs renders as a whisper; removed before she speaks
  drop_tags: [quiet, soft, whispers, whispering, whisper, hushed, small, murmuring, murmurs, under-breath]

rig:
  profile: foxglove
  engine: ">=0.5.8"

emotions: foxglove

extensions:
  - path: ../../extensions/world-context
    config_file: world.yaml
  - path: ../../extensions/emotion-tags
    config_file: director.yaml
  - path: ../../extensions/director
    config_file: director.yaml

env_file: ../../.env
